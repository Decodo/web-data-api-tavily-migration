[project]
name = "web-data-api-tavily-migration"
version = "0.1.0"
description = "Migrate a LangChain agent from Tavily to Decodo's Web Data API, with Tavily kept as a fallback."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "langchain-core>=1.6",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.8"]
